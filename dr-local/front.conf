# 진입점: 평소엔 주 사이트(app-aws), 응답이 없으면 DR(app-dr) 로 (backup)
resolver 127.0.0.11 valid=2s ipv6=off;
upstream petclinic { zone pc 64k; server app-aws:8080 max_fails=1 fail_timeout=3s resolve; server app-dr:8080 backup resolve; }
server {
  listen 80;
  location / { proxy_pass http://petclinic; proxy_set_header Host $http_host; proxy_connect_timeout 1s; proxy_read_timeout 5s; proxy_next_upstream error timeout http_502 http_503; }
}
